name: Tick-Tock AI Coach pre-billing checks

on:
  push:
    branches:
      - feature/ai-coach-free-pilot
      - feature/ai-coach-history-realtime-integration
  pull_request:

jobs:
  typecheck-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: App typecheck
        run: npm run typecheck
      - name: Paid API scaffolds typecheck (never called)
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --types node --skipLibCheck api/ai-feedback.ts api/live-coach.ts
      - name: Build
        run: npm run build
      - name: Unit tests for history, pacing and mock API
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Install relay dependencies
        working-directory: services/qwen-asr-relay
        run: npm ci --no-audit --no-fund
      - name: Free mock relay integration tests
        working-directory: services/qwen-asr-relay
        run: npm test
